[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-review"
version = "1.0.0"
description = "Agentic Code Review — close the loop on AI-generated PRs (Generate-Review-Revise-Verify)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SWE-Review Team" }]
keywords = ["agentic", "code-review", "swe", "claude-code", "cursor", "opencode", "pi"]
dependencies = []

[project.scripts]
swe-review = "swe_review.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swe_review*"]

# The SKILL.md sources ship INSIDE the package tree, because `install-skills`
# resolves them from the installed location (`swe_review/.claude_skills/`,
# see PiAdapter.__init__). Without them a wheel install has no skill source:
# the fallback path points at `<site-packages>/.claude/skills`, which setuptools
# never creates.
#
# Deliberately NOT `[tool.setuptools.data-files]`: that installs to
# `sys.prefix/swe_review/...` (verified by inspecting the built wheel — entries
# land under `<name>-<ver>.data/data/`), i.e. outside the importable package.
# The sources are mirrored into `swe_review/.claude_skills/` by
# `scripts/sync_skill_sources.py` so they remain package data.
[tool.setuptools.package-data]
swe_review = ["py.typed", ".claude_skills/*/SKILL.md"]
